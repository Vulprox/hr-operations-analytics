name: Validate portfolio
on: [push, pull_request, workflow_dispatch]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r projects/employee-references/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_release.py
      - run: python scripts/run_analysis.py
      - run: python projects/employee-references/generate_reference.py --employee-id EMP-0086
